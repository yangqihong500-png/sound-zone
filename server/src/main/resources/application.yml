# ===================== 服务基础 =====================
server:
  port: 8080
  servlet:
    # 统一 /api 前缀，与前端 api 层约定一致（app/src/api/mock.js）
    context-path: /api

spring:
  application:
    name: sound-zone-server

  # ===================== 数据源 =====================
  # MySQL 8（Docker，见 ../../docker-compose.yml）
  # 连接参数说明：
  #   useUnicode/characterEncoding → utf8mb4 中文与 emoji
  #   serverTimezone             → 与容器 TZ=Asia/Shanghai 对齐
  #   useSSL=false               → 本地开发关闭 SSL
  #   allowPublicKeyRetrieval    → MySQL 8 caching_sha2_password 非 SSL 连接所需
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3306/soundzone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: soundzone
    password: soundzone123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ===================== JPA =====================
  jpa:
    hibernate:
      # update：首次启动自动建表（等价于 schema.sql），之后增量更新、不丢数据（平滑迁移）
      # 若需让 Hibernate 校验与 schema.sql 完全一致，可先手动导库后改为 validate
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.soundzone: info
