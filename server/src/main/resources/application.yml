# ===================== 服务基础 =====================
server:
  port: 8080
  servlet:
    # 统一 /api 前缀，与前端 api 层约定一致（app/src/api/mock.js）
    context-path: /api

spring:
  application:
    name: sound-zone-server

  # ===================== 数据源 =====================
  # MySQL 8（Docker，见 ../../docker-compose.yml）
  # 连接参数说明：
  #   useUnicode/characterEncoding → utf8mb4 中文与 emoji
  #   serverTimezone             → 与容器 TZ=Asia/Shanghai 对齐
  #   useSSL=false               → 本地开发关闭 SSL
  #   allowPublicKeyRetrieval    → MySQL 8 caching_sha2_password 非 SSL 连接所需
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3306/soundzone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: soundzone
    password: soundzone123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ===================== JPA =====================
  jpa:
    hibernate:
      # 现有库先执行 sql/migrations，再校验；不让自动 DDL 替代数据迁移。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.soundzone: info

# 业务默认值均可用环境变量覆盖；独立游客与 Audius 默认可用，Demo 图片即时展示。
soundzone:
  # 独立产品 Demo 默认允许游客进入；公开部署可显式关闭并接入自己的账号体系。
  guest-enabled: ${SOUNDZONE_GUEST_ENABLED:true}
  # 默认写入可重复初始化的常驻演示用户与域；公开部署可关闭。
  demo-data-enabled: ${SOUNDZONE_DEMO_DATA_ENABLED:true}
  active-window-minutes: 30
  presence-grace-seconds: 90
  image-directory: ${SOUNDZONE_IMAGE_DIRECTORY:./data/images}
  # 可把自有授权 MP3/M4A 放在这里，再通过 music.local-catalog 的 audio-file 登记。
  audio-directory: ${SOUNDZONE_AUDIO_DIRECTORY:./data/audio}
  admin-key: ${SOUNDZONE_ADMIN_KEY:}
  allowed-origins: ${SOUNDZONE_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  music:
    # FIFO 公平性保护：超长混音、播客和数小时音频不进入曲库候选或队列。
    max-track-duration-seconds: ${SOUNDZONE_MAX_TRACK_DURATION_SECONDS:600}
    audius:
      enabled: ${SOUNDZONE_AUDIUS_ENABLED:true}
      base-url: ${SOUNDZONE_AUDIUS_BASE_URL:https://api.audius.co/v1}
      app-name: ${SOUNDZONE_AUDIUS_APP_NAME:SoundZone}
      api-key: ${SOUNDZONE_AUDIUS_API_KEY:}
      bearer-token: ${SOUNDZONE_AUDIUS_BEARER_TOKEN:}
      search-limit: 20
      connect-timeout-seconds: 5
      read-timeout-seconds: 10
    # 已获授权的小曲库按 server/README.md 示例配置；仓库不附带版权未知音频。
    local-catalog: []
