# ============================================================================
# 同频 SoundZone —— MySQL 8 数据库（Docker）
# 用法：
#   cd sound-zone
#   docker compose up -d          # 启动（后台）
#   docker compose ps             # 查看状态
#   docker compose down           # 停止（保留数据卷）
#   docker compose down -v        # 停止并删除数据卷（清空数据，慎用）
# ============================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: soundzone-mysql
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai                 # 容器时区，与 JDBC serverTimezone 对齐
      MYSQL_ROOT_PASSWORD: root123456   # root 密码（管理员用，Sequel Ace 可登录）
      MYSQL_DATABASE: soundzone         # 启动时自动创建的业务库
      MYSQL_USER: soundzone             # 业务应用账号（后端连接用）
      MYSQL_PASSWORD: soundzone123      # 业务账号密码

    # MySQL 8 字符集与排序规则：utf8mb4 完整支持中文与 emoji
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 端口映射：主机 3306 → 容器 3306（Sequel Ace / 后端均连 127.0.0.1:3306）
    ports:
      - "3306:3306"

    # 数据卷持久化：容器重建后数据不丢
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 12

# 命名数据卷：持久化 MySQL 数据文件
volumes:
  mysql_data:
